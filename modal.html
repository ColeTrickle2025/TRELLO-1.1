<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#16191D;--ink2:#4A5461;--mut:#6B7684;--soft:#8C96A3;
  --line:#DFE3E8;--line2:#ECEFF2;--fld:#CFD5DC;
  --bg:#FFFFFF;--bg2:#F6F7F9;--bg3:#FBFCFD;
  --ac:#0F4C81;--ac2:#0A3A64;--acs:#E8F0F7;--acb:#C7DCEC;
  --wn:#B45309;--wns:#FEF6EC;--wnb:#F3DFC4;
  --ok:#15694A;--oks:#E9F4EF;--okb:#C5E3D6;
  --dg:#B32D2D
}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:14px;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;letter-spacing:.06em}

/* estructura */
.wrap{display:flex;flex-direction:column;min-height:100%}
.head{padding:18px 24px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:13px}
.body{padding:0 24px;flex:1}
.foot{padding:16px 24px;border-top:1px solid var(--line2);background:var(--bg3);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.foot .hint{flex:1;min-width:150px;font-size:12px;color:var(--mut);line-height:1.45}

/* tipografía */
h1{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0 0 4px}
.sub{font-size:13px;color:var(--ink2);line-height:1.5}
.ttl{font-size:17px;font-weight:700;letter-spacing:-.01em}
.mini{font-size:12px;color:var(--mut)}
.sec{display:flex;align-items:center;gap:10px;padding:20px 0 0}
.sec b{font-size:11px;font-weight:700;letter-spacing:.11em;color:var(--soft);text-transform:uppercase}
.sec i{flex:1;height:1px;background:var(--line2);font-style:normal}

/* campos */
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:12px}
.f label,label.lb{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink2);
  text-transform:uppercase;margin-bottom:6px}
.f label .opt{font-weight:500;text-transform:none;letter-spacing:0;color:var(--soft)}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);
  border:1px solid var(--fld);border-radius:8px;padding:11px 12px;width:100%;min-height:44px;outline:none}
textarea{resize:vertical;line-height:1.5;min-height:84px}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(15,76,129,.12)}
input.bad,select.bad{border-color:var(--dg)}
select{appearance:none;-webkit-appearance:none;padding-right:34px;background-repeat:no-repeat;
  background-position:right 11px center;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236B7684' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E")}
.help{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.45}
.err{font-size:11.5px;color:var(--dg);font-weight:600;margin-top:6px}

/* botones */
button{font-family:inherit;cursor:pointer;border:none;outline:none}
.btn{font-size:13.5px;font-weight:600;border-radius:8px;padding:12px 20px;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn-p{color:#fff;background:var(--ac)}
.btn-p:hover{background:var(--ac2)}
.btn-p[disabled]{opacity:.55;cursor:default}
.btn-g{color:var(--ink2);background:var(--bg);border:1px solid var(--line);font-weight:500}
.btn-g:hover{background:var(--bg2)}
.lnk{color:var(--ac);font-weight:500;text-decoration:none;cursor:pointer;background:none;font-size:12px}
.lnk:hover{text-decoration:underline}
.ico-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* segmentado */
.seg{display:flex;border:1px solid var(--fld);border-radius:8px;overflow:hidden}
.seg button{flex:1;font-size:13px;font-weight:500;color:var(--ink2);background:var(--bg);
  padding:12px 6px;min-height:44px;border-left:1px solid var(--fld)}
.seg button:first-child{border-left:none}
.seg button:hover{background:var(--bg2)}
.seg button.on{color:#fff;background:var(--ac);font-weight:600}
.seg button.on:hover{background:var(--ac2)}
.seg button.wn{color:#fff;background:var(--wn);font-weight:600}
.seg button.dg{color:#fff;background:var(--dg);font-weight:600}

/* piezas sueltas */
.badge{width:36px;height:36px;border-radius:9px;background:var(--acs);display:flex;
  align-items:center;justify-content:center;flex-shrink:0}
.badge.n{background:#F1F2F4}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  border-radius:99px;padding:4px 11px;border:1px solid var(--line);background:var(--bg2);color:var(--ink2)}
.chip.ac{background:var(--acs);border-color:var(--acb);color:var(--ac)}
.chip.ok{background:var(--oks);border-color:var(--okb);color:var(--ok)}
.chip.wn{background:var(--wns);border-color:var(--wnb);color:var(--wn)}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.note{padding:12px 14px;background:var(--bg2);border-radius:9px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.note.ac{background:var(--acs);border:1px solid var(--acb);color:var(--ac2)}
.note.wn{background:var(--wns);border:1px solid var(--wnb);color:#6A4A1E}
.opcion{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);text-decoration:none;min-height:44px;width:100%;text-align:left}
.opcion:hover{border-color:var(--ac);background:var(--acs)}
.opcion .t{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:2px}
.opcion .d{font-size:12.5px;color:var(--ink2);line-height:1.45}
.pasos{display:flex;align-items:center;gap:8px;padding:16px 24px 0}
.paso{display:flex;align-items:center;gap:7px}
.paso span{width:20px;height:20px;border-radius:99px;background:var(--bg);border:1px solid var(--line);
  color:var(--ink2);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.paso.on span{background:var(--ac);border-color:var(--ac);color:#fff}
.paso.dn span{background:var(--acs);border-color:var(--acs)}
.paso b{font-size:12px;font-weight:500;color:var(--ink2)}
.paso.on b{font-weight:600;color:var(--ink)}
.linea{flex:1;height:1px;background:var(--line)}
.medida{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.medida input,.medida select{width:76px;text-align:center;min-height:44px}
.medida .sep{color:var(--soft);font-size:16px;font-weight:500}
.lista{padding:13px 15px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;
  color:var(--ink2);display:flex;align-items:center;gap:9px}
.lista:hover{background:var(--bg2)}
.lista.sel{background:var(--acs);color:var(--ac);font-weight:600}
.recientes{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.recientes button{font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;
  padding:6px 12px;color:var(--ink)}
.recientes button:hover{border-color:var(--ac);color:var(--ac)}
.dr{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
.dr:last-child{border-bottom:none}
.dr .k{min-width:150px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--soft);
  text-transform:uppercase;padding-top:2px}
.dr .v{font-weight:600;color:var(--ink)}
</style>

/* ── utilidades ── */
function $(id){return document.getElementById(id);}
function app(){return document.getElementById('app');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function normMatricula(m){
  if(!m)return '';
  return String(m).toUpperCase().trim().replace(/^E[-\s]?/,'').replace(/[\s\-]/g,'');
}
/* Acepta la matrícula española actual y antigua, la E delante, y formatos de fuera.
   Solo rechaza lo que claramente está a medias. */
function validarMatricula(m){
  var n=normMatricula(m);
  if(n.length<5||n.length>10)return false;
  if(!/^[A-Z0-9]+$/.test(n))return false;
  if(/^[0-9]+$/.test(n))return false;          // solo números: le falta algo
  return true;
}
function esMatriculaEspanola(m){
  var n=normMatricula(m);
  return /^[0-9]{4}[BCDFGHJKLMNPRSTVWXYZ]{3}$/.test(n)||/^[A-Z]{1,2}[0-9]{4}[A-Z]{1,3}$/.test(n);
}
/* La cita a las 9:00 de AQUÍ, no de Londres (antes salía a las 11:00 en Trello). */
function citaISO(f){
  try{ return new Date(f+'T09:00:00').toISOString(); }catch(e){ return null; }
}
function fFecha(iso){
  var m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?(m[3]+'/'+m[2]+'/'+m[1]):(iso||'');
}
function medidaTexto(v){
  if(!v.ancho||!v.perfil||!v.llanta)return '';
  var s=v.ancho+'/'+v.perfil+' R'+v.llanta;
  if(v.carga||v.velocidad)s+=' '+(v.carga||'')+(v.velocidad||'');
  return s;
}
function recientes(){
  try{ return JSON.parse(localStorage.getItem('recambios_medidas')||'[]'); }catch(e){ return []; }
}
function guardarReciente(m){
  if(!m)return;
  try{
    var l=recientes().filter(function(x){return x!==m;});
    l.unshift(m);
    localStorage.setItem('recambios_medidas',JSON.stringify(l.slice(0,3)));
  }catch(e){}
}

var state={step:'who',userName:'',tpl:null,values:{},priority:'normal',lists:[],selectedList:null,
           listName:'',msg:null,saving:false,duplicates:[],skipDupCheck:false,listNames:{},tocado:false};

/* ── render raíz ── */
function render(){
  if(MODE==='settings')   return renderSettings();
  if(MODE==='card-detail')return renderCardDetail();
  if(state.step==='who')      return renderWho();
  if(state.step==='pick')     return renderPick();
  if(state.step==='form')     return renderForm();
  if(state.step==='dup-check')return renderDupCheck();
  if(state.step==='list-pick')return renderListPick();
  if(state.step==='hecho')    return renderHecho();
}
function pinta(html){ app().innerHTML=html; t.sizeTo('#app'); }

/* ══════════ ¿QUIÉN ERES? ══════════ */
function renderWho(){
  pinta('<div class="wrap"><div style="padding:48px 24px;text-align:center">'
    +'<div class="mini" style="letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:12px">Usuario</div>'
    +'<div class="sub">Identificando…</div></div></div>');
  t.member('all').then(function(m){
    if(m&&m.fullName){ state.userName=m.fullName.toUpperCase(); state.step='pick'; render(); }
    else renderWhoManual();
  }).catch(renderWhoManual);
}
function renderWhoManual(){
  var h='<div class="wrap"><div class="body" style="padding-top:22px">';
  h+='<h1>¿Quién eres?</h1><div class="sub" style="margin-bottom:18px">Para saber quién pide el material.</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  STAFF.forEach(function(n){
    h+='<button class="opcion" style="padding:14px" onclick="elegirQuien(\''+esc(n)+'\')">'
      +'<div class="badge n" style="width:32px;height:32px;border-radius:99px;font-size:11px;font-weight:700;color:var(--ac)">'
      +esc(iniciales(n))+'</div><div class="t" style="font-size:13.5px">'+esc(n)+'</div></button>';
  });
  h+='</div></div><div class="foot"><div class="hint"></div>'
    +'<button class="btn btn-g" onclick="t.closeModal()">Cancelar</button></div></div>';
  pinta(h);
}
function iniciales(n){
  var p=String(n).trim().split(/\s+/);
  return (p.length>1?p[0][0]+p[p.length-1][0]:String(n).substring(0,2)).toUpperCase();
}
function elegirQuien(n){ state.userName=n; state.step='pick'; render(); }

/* ══════════ ELEGIR TIPO ══════════ */
function pasos(n){
  var p=[['Tipo',1],['Datos',2],['Hecho',3]],h='<div class="pasos">';
  p.forEach(function(x,i){
    if(i)h+='<div class="linea"></div>';
    var cl=n===x[1]?'paso on':(n>x[1]?'paso dn':'paso');
    h+='<div class="'+cl+'"><span>'+(n>x[1]?ico('check','var(--ac)',12):x[1])+'</span><b>'+x[0]+'</b></div>';
  });
  return h+'</div>';
}
function renderPick(){
  var h='<div class="wrap">';
  h+='<div style="padding:18px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:12px">';
  h+='<div style="display:flex;align-items:center;gap:10px">'
    +'<div class="badge" style="width:26px;height:26px;border-radius:6px;background:var(--ac)">'+ico('coche','#fff',15)+'</div>'
    +'<div class="mini" style="font-weight:600;letter-spacing:.1em;text-transform:uppercase">Recambios · Nueva solicitud</div></div>';
  if(state.userName)
    h+='<div class="chip"><span class="mono" style="font-size:10px">'+esc(iniciales(state.userName))+'</span>'
      +esc(capitaliza(state.userName))+'</div>';
  h+='</div>'+pasos(1);
  h+='<div class="body" style="padding-top:22px"><h1>¿Qué necesitas pedir?</h1>'
    +'<div class="sub">Elige el tipo y te pedimos solo lo que hace falta.</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px;margin-top:18px">';
  ORDEN.forEach(function(id){
    var tp=TEMPLATES[id];
    h+='<button class="opcion" onclick="pickTemplate(\''+id+'\')">'
      +'<div class="badge'+(id==='neumaticos'||id==='presupuesto'?'':' n')+'" style="width:44px;height:44px">'
      +ico(tp.icon,(id==='neumaticos'||id==='presupuesto')?'var(--ac)':'#3C4653',22)+'</div>'
      +'<div style="flex:1"><div class="t">'+esc(tp.name)+'</div><div class="d">'+esc(tp.hint)+'</div></div>'
      +ico('mas','var(--soft)',18)+'</button>';
  });
  h+='</div></div>';
  h+='<div class="foot"><div class="hint">Lo que pidas llega a Recambios al momento</div>'
    +'<button class="btn btn-g" onclick="t.closeModal()">Cancelar</button></div></div>';
  pinta(h);
}
function capitaliza(s){
  return String(s).toLowerCase().replace(/(^|\s)([a-záéíóúñ])/g,function(m,a,b){return a+b.toUpperCase();});
}

function pickTemplate(id){
  state.tpl=TEMPLATES[id];
  state.priority='normal';
  state.values={};
  state.msg=null; state.tocado=false; state.skipDupCheck=false; state.duplicates=[];
  // valores por defecto SOLO de los conmutadores (los desplegables van vacíos a propósito)
  state.tpl.secciones.forEach(function(s){
    s.campos.forEach(function(f){ if(f.type==='seg'&&f.def) state.values[f.id]=f.def; });
  });
  state.listName=state.tpl.lista;
  state.selectedList=null;
  cargarListas();
  state.step='form';
  render();
}

function cargarListas(){
  fetch('https://api.trello.com/1/boards/'+BOARD_ID+'/lists?key='+API_KEY+'&token='+API_TOKEN+'&filter=open&fields=id,name')
  .then(function(r){return r.json();})
  .then(function(ls){
    state.lists=ls||[];
    state.listNames={};
    state.lists.forEach(function(l){ state.listNames[l.id]=l.name; });
    var busca=(state.tpl&&state.tpl.lista||'').toUpperCase();
    var m=state.lists.filter(function(l){ return String(l.name).toUpperCase().indexOf(busca)!==-1; })[0];
    if(!m) m=state.lists.filter(function(l){ return l.id===LISTA_POR_DEFECTO; })[0];
    if(!m) m=state.lists[0];
    if(m){ state.selectedList=m.id; state.listName=m.name; }
    if(state.step==='form')render();
  }).catch(function(){});
}

/* ══════════ FORMULARIO ══════════ */
function visible(f){
  if(!f.si)return true;
  var p=f.si.split('='); return (state.values[p[0]]||'')===p[1];
}
function campoHTML(f){
  var v=state.values[f.id];
  var id='f_'+f.id;
  var set="state.values['"+f.id+"']=this.value;borraMsg()";
  var up=f.upper?"this.value=this.value.toUpperCase();":"";
  var falta=state.tocado&&esRequerido(f)&&esVacio(f);
  var h='<div class="f" style="grid-column:span '+(f.span||6)+'">';
  if(f.label)h+='<label for="'+id+'">'+esc(f.label)+(f.opt?' <span class="opt">'+esc(f.opt)+'</span>':'')
    +(esRequerido(f)?' <span style="color:var(--dg)">*</span>':'')+'</label>';

  if(f.type==='text'||f.type==='vin'){
    h+='<input id="'+id+'" type="text"'+(f.upper||f.mono?' class="mono"':'')+(falta?' class="bad"':'')
      +' placeholder="'+esc(f.ph||'')+'" value="'+esc(v||'')+'" oninput="'+up+set+(f.type==='vin'?';pintaVin()':'')+'">';
    if(f.type==='vin'){
      h+='<div id="vinmsg">'+vinMsg(v)+'</div>';
    } else if(f.help){ h+='<div class="help">'+esc(f.help)+'</div>'; }
    if(f.id==='matricula'&&state.tocado&&v&&!validarMatricula(v))
      h+='<div class="err">Esa matrícula parece incompleta.</div>';
  }
  else if(f.type==='textarea'){
    h+='<textarea id="'+id+'" rows="3"'+(falta?' class="bad"':'')+' placeholder="'+esc(f.ph||'')
      +'" oninput="'+set+'">'+esc(v||'')+'</textarea>';
  }
  else if(f.type==='select'){
    h+='<select id="'+id+'"'+(falta?' class="bad"':'')+' onchange="'+set+';refresca()">';
    h+='<option value="">— Elegir —</option>';
    (f.opts||[]).forEach(function(o){
      h+='<option value="'+esc(o)+'"'+(v===o?' selected':'')+'>'+esc(o)+'</option>';
    });
    h+='</select>';
    if(f.help)h+='<div class="help">'+esc(f.help)+'</div>';
  }
  else if(f.type==='modelo'){
    var sug=MODELOS[state.values['marca']]||[];
    h+='<input id="'+id+'" type="text" list="lmod" placeholder="'+(state.values['marca']?'Escribe o elige':'Elige antes la marca')
      +'" value="'+esc(v||'')+'" oninput="'+set+'">';
    h+='<datalist id="lmod">';
    sug.forEach(function(o){ h+='<option value="'+esc(o)+'"></option>'; });
    h+='</datalist>';
  }
  else if(f.type==='seg'){
    h+='<div class="seg">';
    (f.opts||[]).forEach(function(o){
      h+='<button type="button" class="'+(v===o?'on':'')+'" onclick="ponSeg(\''+f.id+'\',\''+esc(o)+'\')">'+esc(o)+'</button>';
    });
    h+='</div>';
  }
  else if(f.type==='prioridad'){
    var pm=state.tpl.prio||PRIO_PEDIDO;
    h+='<div class="seg">';
    ['normal','urgente','muy-urgente'].forEach(function(k){
      var cl=state.priority===k?(k==='normal'?'on':(k==='urgente'?'wn':'dg')):'';
      h+='<button type="button" class="'+cl+'" onclick="setPriority(\''+k+'\')">'+esc(pm[k])+'</button>';
    });
    h+='</div>';
  }
  else if(f.type==='medida'){
    h+='<div class="medida">'
      +mInput('ancho','205',86)+'<span class="sep">/</span>'+mInput('perfil','55',76)
      +'<span class="mono" style="color:var(--ink2);font-size:14px">R</span>'+mInput('llanta','16',76)
      +'<div style="flex:1;display:flex;gap:7px;justify-content:flex-end;min-width:150px">'
      +mInput('carga','91',62)+mSelect('velocidad',['N','P','Q','R','S','T','H','V','W','Y','ZR'],78)
      +'</div></div>'
      +'<div style="display:flex;gap:14px;margin-top:7px;padding:0 2px">'
      +'<div style="font-size:10.5px;color:var(--soft)">ancho · perfil · llanta</div>'
      +'<div style="margin-left:auto;font-size:10.5px;color:var(--soft)">carga · velocidad</div></div>';
    var r=recientes();
    if(r.length){
      h+='<div class="recientes"><div style="font-size:11.5px;font-weight:600;color:var(--mut)">Últimas:</div>';
      r.forEach(function(m){ h+='<button type="button" class="mono" onclick="ponMedida(\''+esc(m)+'\')">'+esc(m)+'</button>'; });
      h+='</div>';
    }
    if(state.tocado&&esVacio(f))h+='<div class="err">Pon al menos ancho, perfil y llanta.</div>';
  }
  else if(f.type==='cita'){
    var sin=!!state.values['sin_cita'];
    var hoy=new Date().toISOString().split('T')[0];
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end">';
    h+='<div><input id="'+id+'" type="date" value="'+esc(state.values['fecha_cita']||'')+'" min="'+hoy+'"'
      +(sin?' disabled style="opacity:.45"':'')+' oninput="state.values[\'fecha_cita\']=this.value;refresca()"></div>';
    h+='<div><label style="display:flex;align-items:center;gap:9px;padding:12px;border:1px solid '
      +(sin?'var(--ac);background:var(--acs)':'var(--line)')+';border-radius:8px;min-height:44px;'
      +'text-transform:none;letter-spacing:0;font-size:13px;font-weight:'+(sin?'600':'500')+';color:'
      +(sin?'var(--ac2)':'var(--ink)')+';margin:0;cursor:pointer">'
      +'<input type="checkbox" '+(sin?'checked ':'')+'style="width:17px;height:17px;min-height:0;padding:0;margin:0;accent-color:var(--ac)" '
      +'onchange="state.values[\'sin_cita\']=this.checked;if(this.checked)state.values[\'fecha_cita\']=\'\';refresca()">'
      +'Aún sin cita</label></div>';
    h+='</div>';
    if(sin)h+='<div class="note" style="margin-top:10px;display:flex;gap:9px;align-items:flex-start">'
      +ico('info','var(--mut)',16)+'<div>Sin cita, la tarjeta irá a tu lista cuando llegue el material, para que llames al cliente.</div></div>';
    if(state.tocado&&esRequerido(f)&&!sin&&!state.values['fecha_cita'])
      h+='<div class="err">Pon una fecha o marca «Aún sin cita».</div>';
  }
  return h+'</div>';
}
function mInput(id,ph,w){
  return '<input class="mono" style="width:'+w+'px" aria-label="'+id+'" placeholder="'+ph+'" value="'
    +esc(state.values[id]||'')+'" oninput="state.values[\''+id+'\']=this.value">';
}
function mSelect(id,opts,w){
  var h='<select class="mono" style="width:'+w+'px" aria-label="'+id+'" onchange="state.values[\''+id+'\']=this.value">';
  h+='<option value="">—</option>';
  opts.forEach(function(o){ h+='<option'+(state.values[id]===o?' selected':'')+'>'+o+'</option>'; });
  return h+'</select>';
}
function esRequerido(f){
  if(!f.required)return false;
  if(f.reqNo){ var p=f.reqNo.split('='); if((state.values[p[0]]||'')===p[1])return false; }
  return true;
}
function esVacio(f){
  if(f.type==='medida')return !(state.values.ancho&&state.values.perfil&&state.values.llanta);
  if(f.type==='cita')return !state.values['fecha_cita']&&!state.values['sin_cita'];
  return !state.values[f.id];
}
function vinMsg(v){
  var n=String(v||'').toUpperCase().replace(/[\s\-]/g,'');
  if(!n)return '';
  if(n.length===17)return '<div class="help" style="color:var(--ok);font-weight:500">17 caracteres · correcto</div>';
  return '<div class="help" style="color:var(--wn);font-weight:500">Lleva '+n.length+' de 17 caracteres</div>';
}
function pintaVin(){ var e=$('vinmsg'); if(e)e.innerHTML=vinMsg(state.values['vin']); }
/* quita el aviso de «faltan…» en cuanto el usuario escribe, sin repintar el formulario */
function borraMsg(){ var e=$('msgbox'); if(e){ e.parentNode.removeChild(e); state.msg=null; } }
function ponSeg(id,val){ state.values[id]=val; state.msg=null; render(); }
function ponMedida(m){
  var x=String(m).match(/(\d+)\s*\/\s*(\d+)\s*R\s*(\d+)\s*(\d+)?\s*([A-Z]{1,2})?/i);
  if(x){ state.values.ancho=x[1];state.values.perfil=x[2];state.values.llanta=x[3];
         state.values.carga=x[4]||'';state.values.velocidad=(x[5]||'').toUpperCase(); }
  render();
}
function setPriority(p){ state.priority=p; render(); }
function refresca(){ state.msg=null; render(); }

function renderForm(){
  var tp=state.tpl;
  var h='<div class="wrap">';
  h+='<div class="head">'
    +'<button class="ico-btn" aria-label="Volver" onclick="state.step=\'pick\';render()">'+ico('atras','var(--ink2)',17)+'</button>'
    +'<div class="badge">'+ico(tp.icon,'var(--ac)',20)+'</div>'
    +'<div style="flex:1"><div class="ttl">'+esc(tp.name)+'</div>'
    +'<div class="mini">Paso 2 de 3'+(state.userName?' · lo pide '+esc(capitaliza(state.userName)):'')+'</div></div></div>';
  h+='<div class="body">';
  tp.secciones.forEach(function(s){
    if(s.si){ var p=s.si.split('='); if((state.values[p[0]]||'')!==p[1])return; }
    var campos=s.campos.filter(visible);
    if(!campos.length)return;
    if(s.t)h+='<div class="sec"><b>'+esc(s.t)+'</b><i></i></div>';
    h+='<div class="grid"'+(s.t?'':' style="margin-top:18px"')+'>';
    campos.forEach(function(f){ h+=campoHTML(f); });
    h+='</div>';
  });
  if(state.msg)h+='<div id="msgbox" class="note '+(state.msg.type==='warn'?'wn':'ac')+'" style="margin-top:16px">'+esc(state.msg.text)+'</div>';
  h+='</div>';
  h+='<div class="foot"><div class="hint">'
    +(tp.id==='presupuesto'?'Te avisamos aquí mismo cuando esté el PDF'
      :'Irá a <b style="color:var(--ink)">'+esc(state.listName||tp.lista)+'</b> · <a class="lnk" onclick="state.step=\'list-pick\';render()">cambiar</a>')
    +'</div>'
    +'<button class="btn btn-g" onclick="t.closeModal()">Cancelar</button>'
    +'<button class="btn btn-p" onclick="submitForm()"'+(state.saving?' disabled':'')+'>'
    +(state.saving?'Creando…':(tp.id==='presupuesto'?'Pedir presupuesto':'Crear tarjeta'))+'</button></div></div>';
  pinta(h);
}

/* ══════════ VALIDAR Y CREAR ══════════ */
function submitForm(){
  var tp=state.tpl;
  state.tocado=true;
  var faltan=[];
  tp.secciones.forEach(function(s){
    if(s.si){ var p=s.si.split('='); if((state.values[p[0]]||'')!==p[1])return; }
    s.campos.filter(visible).forEach(function(f){ if(esRequerido(f)&&esVacio(f))faltan.push(f.label||f.id); });
  });
  if(faltan.length){
    state.msg={type:'warn',text:'Faltan: '+faltan.join(', ')+'.'};
    return render();
  }
  if(state.values['matricula']&&!validarMatricula(state.values['matricula'])){
    state.msg={type:'warn',text:'La matrícula parece incompleta. Revísala.'};
    return render();
  }
  state.msg=null;

  var mat=normMatricula(state.values['matricula']||'');
  var vin=String(state.values['vin']||'').toUpperCase().replace(/[\s\-]/g,'');
  var ot=String(state.values['ot']||'').replace(/\D/g,'');
  if((mat||vin.length===17||ot.length>=4)&&!state.skipDupCheck){
    state.saving=true; render();
    fetch('https://api.trello.com/1/boards/'+BOARD_ID+'/cards?key='+API_KEY+'&token='+API_TOKEN
          +'&filter=open&fields=id,name,idList,desc&checklists=all')
    .then(function(r){return r.json();})
    .then(function(cards){
      var m=(cards||[]).filter(function(c){
        var partes=String(c.name).split(' - ');
        var cm=partes.length>1?normMatricula(partes[1]):'';
        var dn=String(c.desc||'').toUpperCase().replace(/[\s\-\*]/g,'');
        if(mat&&(cm===mat||normMatricula(c.name).indexOf(mat)!==-1))return true;
        if(vin.length===17&&dn.indexOf(vin)!==-1)return true;
        if(ot.length>=4&&new RegExp('OT[^0-9]{0,4}'+ot+'(?![0-9])').test(String(c.name+' '+(c.desc||'')).toUpperCase()))return true;
        return false;
      });
      state.saving=false;
      if(m.length){ state.duplicates=m; state.step='dup-check'; render(); }
      else crearTarjeta();
    })
    .catch(function(){ state.saving=false; crearTarjeta(); });
    return;
  }
  crearTarjeta();
}

function titulo(){
  var tp=state.tpl,v=state.values;
  var p=[];
  p.push(tp.id==='presupuesto'?'[PRESUPUESTO]':tp.id==='airbag'?'[AIRBAG]':
         tp.id==='neumaticos'?'[NEUMATICOS]':'[PEDIDO]');
  if(v.matricula)p.push(String(v.matricula).toUpperCase());
  if(v.ot)p.push('OT '+v.ot);
  var med=medidaTexto(v);
  if(med)p.push(med);
  if(v.marca)p.push(String(v.marca).toUpperCase()+(v.modelo?' '+String(v.modelo).toUpperCase():''));
  if(v.cliente)p.push(String(v.cliente).toUpperCase());
  if(p.length===1){
    var txt=String(v.que_necesita||v.notas||v.referencia||'').replace(/\s+/g,' ').trim();
    if(txt)p.push(txt.length>50?txt.slice(0,50).toUpperCase()+'…':txt.toUpperCase());
  }
  return p.join(' - ');
}
function descripcion(){
  var tp=state.tpl,v=state.values,L=[];
  L.push('## '+tp.name.toUpperCase(),'');
  if(v.marca)L.push('**'+String(v.marca).toUpperCase()+(v.modelo?' '+String(v.modelo).toUpperCase():'')+'**');
  function add(k,val){ if(val)L.push(k+': **'+val+'**'); }
  add('Matrícula',v.matricula); add('Cliente',v.cliente); add('Teléfono',v.telefono);
  add('VIN/Bastidor',v.vin); add('OT',v.ot);
  add('Referencia',v.referencia); add('Medida',medidaTexto(v));
  add('Cantidad',v.cantidad||v.cantidad_txt); add('Tipo',v.tipo); add('Marca',v.marca_neum);
  add('Tipo airbag',v.tipo_airbag); add('Código de campaña',v.cod_campana);
  add('Qué necesita',v.que_necesita); add('Qué busca',v.gama);
  if(v.para==='Material de taller')add('Para','Material de taller (sin coche)');
  if(v.tipo_presu)add('Presupuesto de',v.tipo_presu);
  add('Notas',v.notas);
  var pm=tp.prio||PRIO_PEDIDO;
  L.push('','Prioridad: **'+pm[state.priority]+'**');
  if(v.sin_cita)L.push('Cita: **Aún sin cita**');
  else if(v.fecha_cita)L.push('Cita: **'+fFecha(v.fecha_cita)+'**');
  if(state.userName)L.push('Pedido por: **'+state.userName+'**');
  L.push('','---','*Generado con Stellantis Recambios Power-Up*');
  return L.join('\n');
}

function crearTarjeta(){
  if(!state.selectedList){
    if(state.lists.length){ state.step='list-pick'; return render(); }
    state.msg={type:'warn',text:'No se han podido leer las listas del tablero. Inténtalo otra vez.'};
    return render();
  }
  state.saving=true; render();
  var tp=state.tpl,v=state.values;
  var payload={name:titulo(),desc:descripcion(),idList:state.selectedList,pos:'top'};
  if(v.fecha_cita&&!v.sin_cita){ var d=citaISO(v.fecha_cita); if(d)payload.due=d; }
  var lab=BRAND_LABELS[v.marca||''];
  if(lab)payload.idLabels=[lab];

  fetch('https://api.trello.com/1/cards?key='+encodeURIComponent(API_KEY)+'&token='+encodeURIComponent(API_TOKEN),
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
  .then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(card){
    guardarReciente(medidaTexto(v));
    if(WEBAPP_URL&&WEBAPP_URL.indexOf('PEGA_')===-1){
      fetch(WEBAPP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({template:tp.id,fields:v,priority:state.priority,pedidoPor:state.userName,
          trelloCardId:card.id,sinCita:!!v.sin_cita,fechaCita:v.fecha_cita||'',listName:state.listName,
          medida:medidaTexto(v)})}).catch(function(){});
    }
    fetch('https://api.trello.com/1/cards/'+card.id+'/actions/comments?key='+API_KEY+'&token='+API_TOKEN,
      {method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({text:'Solicitud creada por: **'+(state.userName||'—')+'**'
         +'\n\n_Registrada con el Power-Up Stellantis Recambios._'})}).catch(function(){});
    return t.set('card','shared','pedido-data',
      {template:tp.id,fields:v,priority:state.priority,medida:medidaTexto(v),
       pedidoPor:state.userName,createdAt:Date.now()},{cardId:card.id})
      .catch(function(){}).then(function(){return card;});
  })
  .then(renderHecho)
  .catch(function(e){
    state.saving=false;
    state.msg={type:'warn',text:'No se ha podido crear la tarjeta ('+e.message+'). Inténtalo otra vez.'};
    state.step='form'; render();
  });
}

/* ══════════ DUPLICADO ══════════ */
function renderDupCheck(){
  var v=state.values;
  var h='<div class="wrap">';
  h+='<div style="background:var(--wns);border-bottom:1px solid var(--wnb);padding:20px 24px;display:flex;gap:14px;align-items:flex-start">'
    +'<div style="width:34px;height:34px;border-radius:8px;background:var(--wn);display:flex;align-items:center;justify-content:center;flex-shrink:0">'
    +ico('aviso','#fff',19)+'</div><div>'
    +'<div style="font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px">Este coche ya tiene '
    +(state.duplicates.length>1?state.duplicates.length+' tarjetas abiertas':'una tarjeta abierta')+'</div>'
    +'<div style="font-size:13px;color:#6A4A1E;line-height:1.5">Mira si lo que vas a pedir ya está pedido antes de crear otra.</div>'
    +'</div></div>';
  h+='<div class="body" style="padding-top:18px">';
  if(v.matricula)h+='<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:12px">'
    +'<div style="font-size:11px;font-weight:700;letter-spacing:.11em;color:var(--soft);text-transform:uppercase">Matrícula</div>'
    +'<div class="mono" style="font-size:15px">'+esc(v.matricula)+'</div></div>';
  state.duplicates.slice(0,4).forEach(function(c){
    var items=[];
    (c.checklists||[]).forEach(function(cl){
      if(/RECAMBIOS/i.test(cl.name))(cl.checkItems||[]).forEach(function(i){items.push(i);});
    });
    h+='<div class="card" style="margin-bottom:10px"><div style="padding:14px 15px;border-bottom:1px solid var(--line2)">';
    var ln=state.listNames[c.idList];
    if(ln)h+='<div class="mini" style="margin-bottom:6px">en <b style="color:var(--ink)">'+esc(ln)+'</b></div>';
    h+='<div style="font-size:14px;font-weight:600;line-height:1.4">'+esc(c.name)+'</div></div>';
    if(items.length){
      var ok=items.filter(function(i){return i.state==='complete';}).length;
      h+='<div style="padding:13px 15px;background:var(--bg3)">'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:9px">'
        +'<div style="font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--soft);text-transform:uppercase">Piezas en Recambios</div>'
        +'<div style="font-size:12px;font-weight:600">'+ok+' de '+items.length+' recibidas</div></div>';
      items.slice(0,6).forEach(function(i){
        var c2=i.state==='complete'?'var(--ok)':'var(--wn)';
        h+='<div style="display:flex;align-items:center;gap:9px;margin-bottom:6px;font-size:12.5px">'
          +ico(i.state==='complete'?'check':'reloj',c2,15)+'<div>'+esc(i.name)+'</div></div>';
      });
      h+='</div>';
    }
    h+='<div style="padding:11px 15px;border-top:1px solid var(--line2)">'
      +'<a href="https://trello.com/c/'+esc(c.id)+'" target="_blank" rel="noopener" class="lnk" '
      +'style="font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px">Abrir la tarjeta '
      +ico('fuera','var(--ac)',15)+'</a></div></div>';
  });
  h+='<div class="note" style="margin-top:4px">¿Es una pieza <b>distinta</b> para el mismo coche? Entonces crea la tarjeta. '
    +'Si es lo mismo, no hace falta: ya está pedido.</div>';
  h+='</div>';
  h+='<div class="foot"><div class="hint"></div>'
    +'<button class="btn btn-g" onclick="state.step=\'form\';state.msg=null;render()">Volver</button>'
    +'<button class="btn btn-g" style="color:var(--ink);border-color:var(--fld)" '
    +'onclick="state.skipDupCheck=true;crearTarjeta()">Crear igualmente</button></div></div>';
  pinta(h);
}

/* ══════════ ELEGIR LISTA (solo si lo pide) ══════════ */
function renderListPick(){
  var h='<div class="wrap"><div class="body" style="padding-top:20px">';
  h+='<h1 style="font-size:18px">Elegir lista</h1><div class="sub" style="margin-bottom:14px">¿Dónde quieres que caiga la tarjeta?</div>';
  h+='<div class="card" style="padding:6px">';
  state.lists.forEach(function(l){
    h+='<div class="lista'+(state.selectedList===l.id?' sel':'')+'" onclick="state.selectedList=\''+esc(l.id)
      +'\';state.listName=\''+esc(l.name).replace(/'/g,"\\'")+'\';state.step=\'form\';render()">'
      +(state.selectedList===l.id?ico('check','var(--ac)',16):'<span style="width:16px"></span>')+esc(l.name)+'</div>';
  });
  h+='</div></div><div class="foot"><div class="hint"></div>'
    +'<button class="btn btn-g" onclick="state.step=\'form\';render()">Volver</button></div></div>';
  pinta(h);
}

/* ══════════ HECHO ══════════ */
function renderHecho(){
  state.saving=false; state.step='hecho';
  var v=state.values,tp=state.tpl;
  var pm=tp.prio||PRIO_PEDIDO;
  var h='<div class="wrap">'+pasos(3);
  h+='<div class="body" style="padding-top:26px;text-align:center">'
    +'<div style="width:54px;height:54px;border-radius:99px;background:var(--oks);display:inline-flex;'
    +'align-items:center;justify-content:center;margin-bottom:14px">'+ico('check','var(--ok)',27)+'</div>'
    +'<h1>'+(tp.id==='presupuesto'?'Presupuesto pedido':'Tarjeta creada')+'</h1>'
    +'<div class="sub">'+(tp.id==='presupuesto'
      ?'Te avisaremos en la tarjeta cuando esté el PDF.'
      :'Está en <b style="color:var(--ink)">'+esc(state.listName)+'</b>. Recambios ya la ve.')+'</div></div>';
  h+='<div class="body" style="padding-top:20px"><div class="card" style="padding:16px">';
  function fila(k,val){ if(val)h+='<div class="dr"><div class="k">'+esc(k)+'</div><div class="v">'+esc(val)+'</div></div>'; }
  fila('Matrícula',v.matricula);
  fila('Vehículo',(v.marca||'')+(v.modelo?' '+v.modelo:''));
  fila('Medida',medidaTexto(v));
  fila('Cantidad',v.cantidad||v.cantidad_txt);
  fila('Referencia',v.referencia);
  fila('Cliente',v.cliente);
  h+='</div>';
  h+='<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:14px">'
    +'<span class="chip '+(state.priority==='normal'?'ok':(state.priority==='urgente'?'wn':''))+'"'
    +(state.priority==='muy-urgente'?' style="background:#FBEAEA;border-color:#EFC9C9;color:var(--dg)"':'')+'>'
    +esc(pm[state.priority])+'</span>';
  if(v.fecha_cita)h+='<span class="chip ac">Cita '+esc(fFecha(v.fecha_cita))+'</span>';
  if(v.sin_cita)h+='<span class="chip">Sin cita</span>';
  h+='</div></div>';
  h+='<div class="foot">'
    +'<button class="lnk" style="flex:1;text-align:left;font-size:13.5px;display:inline-flex;align-items:center;gap:6px" '
    +'onclick="state.step=\'pick\';state.values={};state.msg=null;state.tocado=false;state.skipDupCheck=false;render()">'
    +ico('nuevo','var(--ac)',16)+'Otra solicitud</button>'
    +'<button class="btn btn-p" onclick="t.closeModal()">Cerrar</button></div></div>';
  pinta(h);
}

/* ══════════ DETALLE DE TARJETA ══════════ */
function renderCardDetail(){
  t.get('card','shared','pedido-data').then(function(d){
    if(!d){
      pinta('<div class="wrap"><div class="body" style="padding-top:20px">'
        +'<div class="note">Esta tarjeta no la creó el Power-Up, así que no tiene datos guardados.</div></div>'
        +'<div class="foot"><div class="hint"></div><button class="btn btn-g" onclick="t.closeModal()">Cerrar</button></div></div>');
      return;
    }
    var tp=TEMPLATES[d.template]||{icon:'caja',name:'Solicitud',prio:PRIO_PEDIDO};
    var v=d.fields||{},pm=tp.prio||PRIO_PEDIDO;
    var h='<div class="wrap"><div class="head">'
      +'<div class="badge">'+ico(tp.icon,'var(--ac)',20)+'</div>'
      +'<div style="flex:1"><div class="ttl">'+esc(tp.name)+'</div>'
      +'<div class="mini">'+esc(new Date(d.createdAt).toLocaleString('es-ES'))+'</div></div>'
      +'<span class="chip '+(d.priority==='normal'?'ok':'wn')+'">'+esc(pm[d.priority]||'Normal')+'</span></div>';
    h+='<div class="body" style="padding-top:16px"><div class="card" style="padding:16px">';
    function fila(k,val){ if(val)h+='<div class="dr"><div class="k">'+esc(k)+'</div><div class="v">'+esc(val)+'</div></div>'; }
    fila('Matrícula',v.matricula); fila('Cliente',v.cliente); fila('Teléfono',v.telefono);
    fila('Vehículo',(v.marca||'')+(v.modelo?' '+v.modelo:'')); fila('Bastidor',v.vin); fila('OT',v.ot);
    fila('Referencia',v.referencia); fila('Medida',d.medida||''); fila('Cantidad',v.cantidad||v.cantidad_txt);
    fila('Temporada',v.tipo); fila('Marca neumático',v.marca_neum); fila('Tipo de airbag',v.tipo_airbag);
    fila('Código de campaña',v.cod_campana); fila('Qué necesita',v.que_necesita); fila('Qué busca',v.gama);
    fila('Presupuesto de',v.tipo_presu); fila('Notas',v.notas); fila('Pedido por',d.pedidoPor);
    h+='</div></div><div class="foot"><div class="hint"></div>'
      +'<button class="btn btn-g" onclick="t.closeModal()">Cerrar</button></div></div>';
    pinta(h);
  });
}

/* ══════════ CONFIGURACIÓN ══════════ */
function renderSettings(){
  Promise.all([t.get('member','private','apiKey'),t.get('member','private','apiToken')]).then(function(r){
    var h='<div class="wrap"><div class="body" style="padding-top:20px">';
    h+='<h1 style="font-size:18px">Configuración</h1>'
      +'<div class="sub" style="margin-bottom:16px">Tus credenciales se guardan en privado, en tu cuenta de Trello.</div>';
    h+='<div class="note ac" style="margin-bottom:16px">1. Entra en <a href="https://trello.com/app-key" target="_blank" rel="noopener" class="lnk" style="font-size:12.5px">trello.com/app-key</a> y copia tu <b>API Key</b>.<br>'
      +'2. En esa misma página pulsa <b>Generar Token</b> y autoriza.<br>3. Pega los dos aquí y guarda.</div>';
    h+='<div class="f" style="margin-bottom:12px"><label for="cfg_key">API Key</label>'
      +'<input id="cfg_key" type="text" value="'+esc(r[0]||'')+'" placeholder="Pega tu API Key"></div>';
    h+='<div class="f"><label for="cfg_tok">Token</label>'
      +'<input id="cfg_tok" type="password" value="'+esc(r[1]||'')+'" placeholder="Pega tu Token"></div>';
    if(state.msg)h+='<div class="note '+(state.msg.type==='warn'?'wn':'ac')+'" style="margin-top:14px">'+esc(state.msg.text)+'</div>';
    h+='</div><div class="foot"><div class="hint"></div>'
      +'<button class="btn btn-g" onclick="t.closeModal()">Cerrar</button>'
      +'<button class="btn btn-p" onclick="saveSettings()">Guardar</button></div></div>';
    pinta(h);
  });
}
function saveSettings(){
  var k=($('cfg_key')||{}).value||'',tk=($('cfg_tok')||{}).value||'';
  if(!k||!tk){ state.msg={type:'warn',text:'Hacen falta los dos.'}; return renderSettings(); }
  Promise.all([t.set('member','private','apiKey',k),t.set('member','private','apiToken',tk)])
    .then(function(){ state.msg={type:'ok',text:'Guardado.'}; renderSettings(); });
}

render();
</script>
